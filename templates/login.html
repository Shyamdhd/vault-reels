<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault — Sign In</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#101828">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vault: {
              navy: '#101828',
              navyDark: '#0C1322',
              primary: '#4F46E5',
              primaryHover: '#4338CA',
              accent: '#8B5CF6',
              bg: '#FAFBFF'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-brand {
      font-family: 'Space Grotesk', sans-serif;
    }
    .mesh-gradient {
      background: radial-gradient(circle at 20% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
                  #101828;
    }
  </style>
</head>
<body class="mesh-gradient min-h-screen text-gray-200 flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- TOP BRAND NAV -->
  <header class="p-6 lg:px-12 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition transform">
        <i data-lucide="clapperboard" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white font-brand">VAULT</h1>
        <p class="text-[10px] text-gray-400 font-medium tracking-wide">Save Reels. Find Them Instantly.</p>
      </div>
    </a>

    <a href="/" class="inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-white px-3 py-1.5 rounded-lg border border-slate-700/60 hover:border-slate-500 transition">
      <span>Back to Library</span>
      <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
    </a>
  </header>

  <!-- AUTH MAIN CONTAINER -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">

      <!-- Card Shell -->
      <div class="bg-[#151F33]/90 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-8 shadow-2xl shadow-black/40 relative overflow-hidden">
        
        <!-- Subtle Glow Blob -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Mode Tabs -->
        <div class="flex p-1 bg-slate-900/80 rounded-2xl border border-slate-800 mb-6">
          <button id="tabSignIn" onclick="switchTab('signin')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-sm transition">
            Sign In
          </button>
          <button id="tabSignUp" onclick="switchTab('signup')" class="flex-1 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition">
            Create Account
          </button>
        </div>

        <!-- Header Titles -->
        <div class="text-center mb-6">
          <h2 id="authHeading" class="text-2xl font-bold text-white font-brand">Welcome back</h2>
          <p id="authSubheading" class="text-xs text-gray-400 mt-1">Sign in to access your creative inspiration reels</p>
        </div>

        <!-- Feedback Alert -->
        <div id="authAlert" class="hidden mb-4 p-3 rounded-xl text-xs flex items-center gap-2"></div>

        <!-- Auth Form -->
        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          
          <!-- Full Name (Sign Up only) -->
          <div id="nameGroup" class="hidden space-y-1.5">
            <label class="block text-xs font-medium text-gray-300">Full Name</label>
            <div class="relative">
              <i data-lucide="user" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" id="nameInput" placeholder="Alex Rivera" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>

          <!-- Email -->
          <div class="space-y-1.5">
            <label class="block text-xs font-medium text-gray-300">Email Address</label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="emailInput" required placeholder="alex@vaultcreative.design" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-indigo-500 transition">
            </div>
          </div>

          <!-- Password -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-medium text-gray-300">Password</label>
              <button type="button" onclick="alert('Password reset link will be sent to your email.')" class="text-[11px] text-indigo-400 hover:text-indigo-300 transition">Forgot?</button>
            </div>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-gray-500 text-xs focus:outline-none focus:border-indigo-500 transition">
              <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                <i id="eyeIcon" data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me -->
          <div class="flex items-center gap-2 pt-1">
            <input type="checkbox" id="rememberMe" checked class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
            <label for="rememberMe" class="text-xs text-gray-400 select-none">Remember this device</label>
          </div>

          <!-- Primary Submit Button -->
          <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs tracking-wide shadow-lg shadow-indigo-600/30 transition transform hover:scale-[1.01] active:scale-[0.99] flex items-center justify-center gap-2">
            <span id="submitBtnText">Sign In to Vault</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

      </div>

      <!-- Trust & Technology Footer -->
      <div class="mt-6 text-center text-[11px] text-gray-500 flex items-center justify-center gap-3">
        <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i> Supabase Cloud</span>
        <span>•</span>
        <span>256-Bit SSL</span>
        <span>•</span>
        <span>500MB Media Storage</span>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="p-6 text-center text-xs text-gray-500 border-t border-slate-800/60">
    <p>© 2026 Vault Creative Library. Built for video creators, editors, and art directors.</p>
  </footer>

  <script>
    let currentMode = 'signin';

    function switchTab(mode) {
      currentMode = mode;
      const tabSignIn = document.getElementById('tabSignIn');
      const tabSignUp = document.getElementById('tabSignUp');
      const nameGroup = document.getElementById('nameGroup');
      const authHeading = document.getElementById('authHeading');
      const authSubheading = document.getElementById('authSubheading');
      const submitBtnText = document.getElementById('submitBtnText');
      const alertEl = document.getElementById('authAlert');
      if (alertEl) alertEl.classList.add('hidden');

      if (mode === 'signup') {
        tabSignUp.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-sm transition";
        tabSignIn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition";
        nameGroup.classList.remove('hidden');
        authHeading.innerText = "Create your account";
        authSubheading.innerText = "Join Vault to curate and organize inspiration reels";
        submitBtnText.innerText = "Create Vault Account";
      } else {
        tabSignIn.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-white bg-indigo-600 shadow-sm transition";
        tabSignUp.className = "flex-1 py-2 rounded-xl text-xs font-semibold text-gray-400 hover:text-white transition";
        nameGroup.classList.add('hidden');
        authHeading.innerText = "Welcome back";
        authSubheading.innerText = "Sign in to access your creative inspiration reels";
        submitBtnText.innerText = "Sign In to Vault";
      }
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passwordInput.type = 'password';
        eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showAlert(msg, type = 'error') {
      const alertEl = document.getElementById('authAlert');
      alertEl.classList.remove('hidden', 'bg-red-950/60', 'border-red-800', 'text-red-200', 'bg-emerald-950/60', 'border-emerald-800', 'text-emerald-200');
      if (type === 'error') {
        alertEl.classList.add('bg-red-950/60', 'border', 'border-red-800', 'text-red-200');
        alertEl.innerHTML = `<i data-lucide="alert-circle" class="w-4 h-4 text-red-400 shrink-0"></i><span>${msg}</span>`;
      } else {
        alertEl.classList.add('bg-emerald-950/60', 'border', 'border-emerald-800', 'text-emerald-200');
        alertEl.innerHTML = `<i data-lucide="check-circle" class="w-4 h-4 text-emerald-400 shrink-0"></i><span>${msg}</span>`;
      }
      lucide.createIcons();
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const name = document.getElementById('nameInput')?.value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const submitBtnText = document.getElementById('submitBtnText');

      if (!email || !password) {
        showAlert('Please provide both email and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtnText.innerText = currentMode === 'signup' ? "Creating Account..." : "Signing in...";

      try {
        const endpoint = currentMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });
        const data = await res.json();

        if (res.ok && data.user) {
          showAlert(currentMode === 'signup' ? 'Account created! Redirecting...' : 'Signed in! Redirecting...', 'success');
          
          // Clear all previous user data & cache before logging into new account
          Object.keys(localStorage).forEach(k => {
            if (k.startsWith('vault_')) localStorage.removeItem(k);
          });
          sessionStorage.clear();

          localStorage.setItem('vault_user', JSON.stringify(data.user));
          if (data.access_token) {
            localStorage.setItem('vault_token', data.access_token);
          }
          setTimeout(() => {
            window.location.href = '/';
          }, 600);
        } else {
          showAlert(data.error || 'Authentication failed. Please verify your credentials.');
        }
      } catch (err) {
        showAlert('Network error. Please check your connection and try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtnText.innerText = currentMode === 'signup' ? "Create Vault Account" : "Sign In to Vault";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
