<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="vMarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="vaultShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#vaultGrad)" filter="url(#vaultShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />

  <!-- Vault Stylized Monogram / Reel Spark -->
  <g transform="translate(106, 110)">
    <!-- Vault Outer Shield / Reel Geometric Wings -->
    <path d="M150 250 L40 50 L110 50 L150 140 L190 50 L260 50 Z" fill="url(#vMarkGrad)" />
    <!-- Center Play Jewel -->
    <circle cx="150" cy="85" r="28" fill="#FBBF24" />
    <polygon points="144,74 162,85 144,96" fill="#1E1B4B" />
  </g>
</svg>
